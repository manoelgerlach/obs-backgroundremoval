name: Crash Report
description: Submit a Windows OBS Studio crash report for this unofficial DirectML fork
title: '[Crash]: '
labels: 'crash report'
assignees: ''
body:
  - type: checkboxes
    id: privacy_and_sharing
    attributes:
      label: Privacy and Sharing
      options:
        - label: I confirm that the crash reports I upload do not contain personal information, and I agree to share their contents publicly with the community.
          required: true

  - type: upload
    id: crash_report
    attributes:
      label: Crash Report
      description: |
        Fork issue tracker: https://github.com/manoelgerlach/obs-backgroundremoval/issues
        Upload one or more OBS Studio crash reports.
        Windows: `%APPDATA%\obs-studio\crashes`
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add anything else that may help. This field is optional.
    validations:
      required: false
